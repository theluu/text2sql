server {
    listen 80;
    listen [::]:80;
    server_name text2sql.themeshub.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/text2sql.themeshub.net/public;
        default_type "text/plain";
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

upstream text2sql_api { server 127.0.0.1:8021; keepalive 16; }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name text2sql.themeshub.net;

    ssl_certificate     /etc/letsencrypt/live/text2sql.themeshub.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/text2sql.themeshub.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/text2sql.access.log;
    error_log  /var/log/nginx/text2sql.error.log;

    root /var/www/text2sql.themeshub.net/public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 1m;

    # API + Server-Sent Events (question streaming, notifications, eval progress)
    location ^~ /api/ {
        proxy_pass http://text2sql_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every other path serves index.html (never cached, so deploys show up at once)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
