name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: make env && sed -i "s/^WAREHOUSE_SEED_SCALE=.*/WAREHOUSE_SEED_SCALE=0.05/" .env
      - run: GIT_SHA=${{ github.sha }} docker compose up -d --build
      - run: timeout 300 sh -c 'until curl -fsS localhost:8080/api/health; do sleep 3; done'
      - run: |
          curl -fsS -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"viewer@demo.vn","password":"demo1234"}' | grep -q access_token
      - name: Eval smoke gate (cassette replay, no API keys needed)
        run: docker compose exec -T api python -m app.cli eval --suite smoke --mode chain --cassette replay --gate eval/baseline.json --out /tmp/eval.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: E2E (Playwright against the running stack)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 npx playwright test
      - if: failure()
        run: docker compose logs
