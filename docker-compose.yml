name: text2sql

services:
  app-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: app
    volumes: [app-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 20

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_ADMIN_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    volumes: [warehouse-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_ADMIN_USER} -d ${WAREHOUSE_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  bootstrap:
    build: ./backend
    command: ["python", "-m", "app.cli", "bootstrap"]
    env_file: .env
    depends_on:
      app-db: { condition: service_healthy }
      warehouse: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  app-db-data:
  warehouse-data:
